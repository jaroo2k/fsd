services:
  runner:
    build: .
    # Runs the code in this folder (/workspace/fsd) instead of the copy in the image, so a code change
    # needs only "docker compose restart runner". Rebuild only when the Dockerfile changes.
    # No --watch: a run that edits this repo would restart the server and cut itself off.
    # Links only the login files from this PC's folders, so the container uses the PC's login.
    # Mounting a single file pins it, so a token the PC refreshes would never reach the container.
    # The folders are mounted aside, not used as the container's own config: their settings hold Windows-only hooks.
    command: ["sh", "-c", "mkdir -p ~/.claude ~/.codex && ln -sfn /host/claude/.credentials.json ~/.claude/.credentials.json && ln -sfn /host/codex/auth.json ~/.codex/auth.json && exec node /workspace/fsd/server.js"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      HOST: 0.0.0.0
      RUNNER_ROOT: /workspace
      RUNNER_DB: /data/runner.db
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      DOCKER_HOST: tcp://docker:2375
      # Windows git checks files out with CRLF (core.autocrlf=true in its system config, which is not mounted).
      # Without the same setting, git here sees every such file as changed and refuses to start a run.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "true"
    volumes:
      - ${RUNNER_WORKSPACE:-..}:/workspace
      - runner-data:/data
      - ${USERPROFILE}/.claude:/host/claude
      - ${USERPROFILE}/.codex:/host/codex
      - ${USERPROFILE}/.gitconfig:/home/node/.gitconfig:ro

  # Separate daemon so test runs cannot touch the host's containers. No ports published:
  # the unauthenticated 2375 port is reachable only from this compose network.
  docker:
    image: docker:29-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Same path as the runner, so bind mounts in project compose files resolve. Default .. = parent of this repo.
      - ${RUNNER_WORKSPACE:-..}:/workspace
      - docker-data:/var/lib/docker

volumes:
  runner-data:
  docker-data:
